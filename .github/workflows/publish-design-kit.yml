name: publish design-kit

# Composer cannot install a package from a subdirectory, so packages/design-kit
# is written here and published to dashcoretech/design-kit as a repo of its own.
# That used to be a subtree push somebody ran by hand and forgot. Now a push to
# master republishes the mirror, and a design-kit/vX.Y.Z tag releases it.
#
# Releasing:
#   git tag design-kit/v1.1.0 && git push origin design-kit/v1.1.0
#
# Needs a DASHCORE_DESIGN secret: a token that can write to the mirror. The
# built-in GITHUB_TOKEN cannot, because it only ever reaches this repo.

on:
  push:
    branches:
      - master
    tags:
      - 'design-kit/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-design-kit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # subtree split rewrites the whole history of the prefix, so a shallow
          # clone produces a different sha and the push is rejected.
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the package to its own repo
        env:
          DASHCORE_DESIGN: ${{ secrets.DASHCORE_DESIGN }}
        run: |
          set -euo pipefail

          if [ -z "${DASHCORE_DESIGN}" ]; then
            echo "DASHCORE_DESIGN is not set."
            echo "Add a repository secret holding a token that can write to dashcoretech/design-kit."
            exit 1
          fi

          # A token pasted into the secret box picks up a trailing newline more
          # often than not. No token has whitespace in it, so taking it out is
          # always safe and saves re-pasting the secret.
          token=$(printf '%s' "${DASHCORE_DESIGN}" | tr -d '[:space:]')
          if [ -z "${token}" ]; then
            echo 'DASHCORE_DESIGN is empty or only whitespace.'
            exit 1
          fi

          # A GitHub token is letters, digits and underscores, and nothing else.
          # Checking that here turns "URL rejected: Bad hostname", which sounds
          # like a network fault, into a sentence about the secret.
          case "${token}" in
            *[!A-Za-z0-9_]*)
              echo 'DASHCORE_DESIGN does not look like a GitHub token.'
              echo 'A token is letters, digits and underscores only, and begins ghp_ or github_pat_.'
              echo 'The stored value has other characters in it, so it is probably not the token.'
              exit 1 ;;
          esac

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The credential goes in a header rather than the URL. Git parses a
          # URL before it authenticates, so anything unexpected in the token
          # fails as a malformed address instead of as a rejected credential.
          auth=$(printf 'x-access-token:%s' "${token}" | base64 -w0)
          mirror='https://github.com/dashcoretech/design-kit.git'
          split=$(git subtree split --prefix=packages/design-kit)
          echo "split commit: ${split}"

          # A push with nothing new in it is already up to date, so this is safe
          # to run on every master push rather than guessing at changed paths.
          git -c "http.extraheader=Authorization: Basic ${auth}" push "${mirror}" "${split}:refs/heads/master"

          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            version="${GITHUB_REF_NAME#design-kit/}"
            echo "releasing ${version}"
            git -c "http.extraheader=Authorization: Basic ${auth}" push "${mirror}" "${split}:refs/tags/${version}"
          fi
