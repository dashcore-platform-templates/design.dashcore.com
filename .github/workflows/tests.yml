name: tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Flux Pro is a paid package on its own Composer host, so an install here
      # is a 401 without a licence. The message is what Composer prints when it
      # wants to prompt and cannot, which reads as a hang rather than a secret.
      - name: Authenticate Flux Pro
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FLUX_USERNAME}" ] || [ -z "${FLUX_LICENSE_KEY}" ]; then
            echo 'FLUX_USERNAME and FLUX_LICENSE_KEY are not set.'
            echo 'Add them as repository secrets; they are the Flux Pro licence this app installs with.'
            exit 1
          fi
          composer config --global http-basic.composer.fluxui.dev "${FLUX_USERNAME}" "${FLUX_LICENSE_KEY}"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
